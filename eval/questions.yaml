questions:
  - id: "orders-count"
    question: "How many orders are in the dataset?"
    gold_sql: "SELECT COUNT(*) AS order_count FROM orders"
    category: "counts"
    expect: "answer"
    split: "dev"
  - id: "seller-count"
    question: "How many sellers are listed in the dataset?"
    gold_sql: "SELECT COUNT(*) AS seller_count FROM sellers"
    category: "counts"
    expect: "answer"
    split: "test"
  - id: "product-category-count"
    question: "How many distinct product categories are assigned to products?"
    gold_sql: "SELECT COUNT(DISTINCT product_category_name) AS category_count FROM products"
    category: "catalog"
    expect: "answer"
    split: "test"
  - id: "average-review-score"
    question: "What is the average review score?"
    gold_sql: "SELECT AVG(review_score) AS average_review_score FROM order_reviews"
    category: "reviews"
    expect: "answer"
    split: "test"
  - id: "customer-email-refusal"
    question: "What are the customers' email addresses?"
    gold_sql: ""
    category: "unavailable_fields"
    expect: "refuse"
    split: "test"
